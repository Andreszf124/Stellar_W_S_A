name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  contract:
    name: Contract (test, clippy, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pinned channel and wasm target live in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal \
            --component clippy --target wasm32v1-none

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Test
        run: cargo test -p grano-de-origen --locked
      - name: Clippy
        run: cargo clippy -p grano-de-origen --all-targets --locked -- -D warnings
      - name: Build wasm
        run: cargo build -p grano-de-origen --target wasm32v1-none --release --locked

  app:
    name: App (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A transitive wallet dependency runs `yarn setup` on install, so skip
      # install scripts.
      - run: npm ci --ignore-scripts

      # The generated contract client is versioned in app-lib/clients, so the app
      # builds without redeploying the contract.
      - name: Lint
        run: npm run lint --workspace app
      - name: Typecheck and build
        run: npm run build --workspace app
